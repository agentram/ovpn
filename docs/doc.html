<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ovpn docs</title>
    <meta
      name="description"
      content="Formatted ovpn documentation for operators and engineers."
    >
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
    >
    <style>
      :root {
        --bg: #030404;
        --surface: #0b0d0e;
        --surface-2: #111417;
        --ink: #f3f4f1;
        --muted: #a8aaa5;
        --quiet: #757a78;
        --line: #25292b;
        --line-strong: #42474a;
        --silver: #d8d9d4;
        --accent: #8fb7c4;
        --green: #8bb99a;
        --code-bg: #050606;
        --code-fg: #e7e8e3;
      }

      * { box-sizing: border-box; }

      html {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }

      body {
        width: 100%;
        max-width: 100%;
        margin: 0;
        overflow-x: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(3, 4, 4, 0.64), var(--bg) 380px),
          url("assets/ovpn-hero.png") top center / 1680px auto no-repeat,
          var(--bg);
      }

      a { color: var(--silver); }

      .wrap {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 22px 0;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        color: var(--ink);
        font-size: 1.05rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
        max-width: 100%;
      }

      .nav a,
      .doc-nav a,
      .button {
        min-width: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 10px 14px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: rgba(12, 14, 15, 0.82);
        color: var(--ink);
        font-size: 0.92rem;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
      }

      .doc-layout {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr);
        gap: 28px;
        align-items: start;
        padding: 32px 0 56px;
      }

      .doc-nav {
        min-width: 0;
        position: sticky;
        top: 18px;
        display: grid;
        gap: 8px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(11, 13, 14, 0.94);
      }

      .doc-nav a {
        justify-content: flex-start;
        min-height: 36px;
        border-radius: 8px;
        background: transparent;
        font-size: 0.88rem;
      }

      .doc-nav a[aria-current="page"] {
        border-color: rgba(216, 217, 212, 0.62);
        background: var(--silver);
        color: #080909;
      }

      .doc-card {
        min-width: 0;
        padding: clamp(22px, 4vw, 44px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(11, 13, 14, 0.96);
      }

      .doc-meta {
        margin-bottom: 18px;
        color: var(--quiet);
        font-size: 0.86rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .markdown {
        min-width: 0;
        max-width: 100%;
        color: var(--ink);
        font-size: 1rem;
        line-height: 1.72;
        overflow-wrap: anywhere;
      }

      .markdown > *:first-child { margin-top: 0; }
      .markdown > *:last-child { margin-bottom: 0; }

      .markdown h1,
      .markdown h2,
      .markdown h3,
      .markdown h4,
      .markdown h5,
      .markdown h6 {
        margin: 2rem 0 0.8rem;
        line-height: 1.18;
      }

      .markdown h1 {
        max-width: 900px;
        font-size: clamp(2rem, 4vw, 3.4rem);
      }

      .markdown h2 {
        padding-top: 0.4rem;
        border-top: 1px solid var(--line);
        font-size: clamp(1.45rem, 2.4vw, 2.05rem);
      }

      .markdown h3 { font-size: 1.24rem; }
      .markdown h4 { font-size: 1.06rem; }

      .markdown p,
      .markdown ul,
      .markdown ol,
      .markdown blockquote,
      .markdown table,
      .markdown pre {
        margin: 0 0 1rem;
      }

      .markdown p,
      .markdown li {
        max-width: 900px;
        overflow-wrap: anywhere;
      }

      .markdown ul,
      .markdown ol {
        padding-left: 1.4rem;
      }

      .markdown li + li {
        margin-top: 0.25rem;
      }

      .markdown code {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0.12rem 0.35rem;
        background: var(--surface-2);
        color: var(--silver);
        font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
        font-size: 0.92em;
        overflow-wrap: anywhere;
      }

      .markdown pre {
        max-width: 100%;
        overflow: auto;
        padding: 18px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--code-bg);
        color: var(--code-fg);
        line-height: 1.58;
      }

      .markdown pre code {
        display: block;
        border: 0;
        padding: 0;
        background: transparent;
        color: inherit;
        font-size: 0.88rem;
      }

      .markdown blockquote {
        padding: 10px 16px;
        border-left: 4px solid var(--green);
        background: var(--surface-2);
        color: var(--muted);
      }

      .markdown table {
        display: block;
        width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
      }

      .markdown th,
      .markdown td {
        padding: 10px 12px;
        border: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      .markdown th {
        background: var(--surface-2);
      }

      .markdown hr {
        height: 1px;
        border: 0;
        margin: 2rem 0;
        background: var(--line);
      }

      .error {
        padding: 18px;
        border: 1px solid #c68772;
        border-radius: 8px;
        background: rgba(198, 135, 114, 0.12);
        color: #efc4b6;
      }

      footer {
        padding: 0 0 44px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      @media (max-width: 820px) {
        .wrap {
          width: calc(100% - 20px);
          max-width: 1180px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .nav {
          justify-content: flex-start;
          display: grid;
          grid-template-columns: 1fr;
          overflow-x: visible;
          padding-bottom: 2px;
          width: 100%;
        }

        .nav a { width: 100%; }

        .nav a,
        .doc-nav a,
        .button {
          white-space: normal;
          text-align: center;
        }

        .doc-layout {
          grid-template-columns: 1fr;
          gap: 16px;
          padding-top: 16px;
        }

        .doc-nav {
          position: static;
          display: grid;
          grid-template-columns: 1fr;
          overflow-x: visible;
        }
      }

      @media (max-width: 460px) {
        .nav {
          grid-template-columns: 1fr;
        }

        .nav { width: 100%; }
        .doc-card { border-radius: 8px; }
      }
    </style>
  </head>
  <body>
    <header class="wrap topbar">
      <a class="brand" href="./">ovpn</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="./">Overview</a>
        <a href="https://github.com/agentram/ovpn">GitHub</a>
        <a href="https://x.com/OVPN_project">X</a>
        <a href="donate/">Donate</a>
      </nav>
    </header>

    <main class="wrap doc-layout">
      <aside class="doc-nav" aria-label="Documentation navigation" id="doc-nav"></aside>
      <article class="doc-card">
        <div class="doc-meta">Documentation / <span id="doc-label">loading</span></div>
        <div class="markdown" id="doc-content">Loading...</div>
      </article>
    </main>

    <footer class="wrap">
      Source-available under the Attribution-NonCommercial Source License 1.0 (ovpn). Commercial use requires separate permission.
    </footer>

    <script>
      const docs = {
        "clients.md": { title: "Client guide (English)", source: "clients.md", lang: "en" },
        "clients-ru.md": { title: "Client guide (Russian)", source: "clients-ru.md", lang: "ru" },
        "cli.md": { title: "CLI operations", source: "cli.md", lang: "en" },
        "monitoring.md": { title: "Monitoring", source: "monitoring.md", lang: "en" },
        "ha.md": { title: "HA topology", source: "ha.md", lang: "en" },
        "security.md": { title: "Security model", source: "security.md", lang: "en" },
        "ci.md": { title: "CI/CD", source: "ci.md", lang: "en" },
        "testing.md": { title: "Testing", source: "testing.md", lang: "en" },
        "upgrades.md": { title: "Upgrades", source: "upgrades.md", lang: "en" }
      };

      const nav = document.getElementById("doc-nav");
      const content = document.getElementById("doc-content");
      const label = document.getElementById("doc-label");
      const params = new URLSearchParams(window.location.search);
      const currentDoc = params.get("doc") || "monitoring.md";

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function escapeAttr(value) {
        return escapeHtml(value).replaceAll("`", "&#96;");
      }

      function encodePath(path) {
        return path.split("/").map((part) => encodeURIComponent(part)).join("/");
      }

      function routeHref(rawHref) {
        const href = rawHref.trim();
        if (/^(https?:|mailto:|#)/i.test(href)) {
          return href;
        }

        const hashIndex = href.indexOf("#");
        const path = hashIndex === -1 ? href : href.slice(0, hashIndex);
        const hash = hashIndex === -1 ? "" : href.slice(hashIndex);
        const cleanPath = path.replace(/^\.?\//, "");
        const docName = cleanPath.replace(/^docs\//, "");

        if (docs[docName]) {
          return `doc.html?doc=${encodeURIComponent(docName)}${hash}`;
        }

        if (cleanPath.endsWith(".md")) {
          const repoPath = cleanPath.startsWith("docs/") ? cleanPath : cleanPath.replace(/^\/+/, "");
          return `https://github.com/agentram/ovpn/blob/main/${encodePath(repoPath)}`;
        }

        return "#";
      }

      function renderTextMarkup(text) {
        let result = "";
        let lastIndex = 0;
        const linkPattern = /\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g;

        for (const match of text.matchAll(linkPattern)) {
          result += applyEmphasis(escapeHtml(text.slice(lastIndex, match.index)));
          result += `<a href="${escapeAttr(routeHref(match[2]))}">${applyEmphasis(escapeHtml(match[1]))}</a>`;
          lastIndex = match.index + match[0].length;
        }

        result += applyEmphasis(escapeHtml(text.slice(lastIndex)));
        return result;
      }

      function applyEmphasis(html) {
        return html
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>");
      }

      function renderInline(text) {
        return text
          .split(/(`[^`]*`)/g)
          .map((part) => {
            if (part.startsWith("`") && part.endsWith("`")) {
              return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
            }
            return renderTextMarkup(part);
          })
          .join("");
      }

      function stripMarkdown(text) {
        return text
          .replace(/`([^`]+)`/g, "$1")
          .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
          .replace(/[*_~#]/g, "")
          .replace(/<[^>]+>/g, "")
          .trim();
      }

      function slugify(text) {
        const slug = stripMarkdown(text)
          .toLowerCase()
          .normalize("NFKD")
          .replace(/[^\p{Letter}\p{Number}]+/gu, "-")
          .replace(/^-+|-+$/g, "");
        return slug || "section";
      }

      function tableCells(line) {
        return line
          .trim()
          .replace(/^\|/, "")
          .replace(/\|$/, "")
          .split("|")
          .map((cell) => cell.trim());
      }

      function isTableDelimiter(line) {
        return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
      }

      function isTableStart(lines, index) {
        return lines[index].includes("|") && index + 1 < lines.length && isTableDelimiter(lines[index + 1]);
      }

      function renderTable(lines, startIndex) {
        const rows = [tableCells(lines[startIndex])];
        let index = startIndex + 2;

        while (index < lines.length && lines[index].includes("|") && lines[index].trim() !== "") {
          rows.push(tableCells(lines[index]));
          index += 1;
        }

        const header = rows.shift() || [];
        const head = header.map((cell) => `<th>${renderInline(cell)}</th>`).join("");
        const body = rows
          .map((row) => `<tr>${row.map((cell) => `<td>${renderInline(cell)}</td>`).join("")}</tr>`)
          .join("");

        return {
          html: `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`,
          nextIndex: index
        };
      }

      function renderMarkdown(markdown) {
        const lines = markdown.replace(/\r\n/g, "\n").split("\n");
        const html = [];
        const paragraph = [];
        const usedIds = new Map();
        let listType = "";
        let inCode = false;
        let codeLang = "";
        let codeLines = [];
        let pendingAnchor = "";

        function uniqueId(base) {
          const count = usedIds.get(base) || 0;
          usedIds.set(base, count + 1);
          return count === 0 ? base : `${base}-${count + 1}`;
        }

        function closeParagraph() {
          if (paragraph.length > 0) {
            html.push(`<p>${renderInline(paragraph.join(" "))}</p>`);
            paragraph.length = 0;
          }
        }

        function closeList() {
          if (listType) {
            html.push(`</${listType}>`);
            listType = "";
          }
        }

        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index];
          const trimmed = line.trim();

          if (inCode) {
            if (trimmed.startsWith("```")) {
              html.push(`<pre><code class="language-${escapeAttr(codeLang)}">${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              inCode = false;
              codeLang = "";
              codeLines = [];
            } else {
              codeLines.push(line);
            }
            continue;
          }

          const codeFence = trimmed.match(/^```([A-Za-z0-9_-]*)/);
          if (codeFence) {
            closeParagraph();
            closeList();
            inCode = true;
            codeLang = codeFence[1] || "text";
            codeLines = [];
            continue;
          }

          const anchor = trimmed.match(/^<a\s+id=["']([^"']+)["']\s*><\/a>$/i);
          if (anchor) {
            pendingAnchor = anchor[1];
            continue;
          }

          if (trimmed === "") {
            closeParagraph();
            closeList();
            continue;
          }

          if (/^---+$/.test(trimmed)) {
            closeParagraph();
            closeList();
            html.push("<hr>");
            continue;
          }

          if (isTableStart(lines, index)) {
            closeParagraph();
            closeList();
            const table = renderTable(lines, index);
            html.push(table.html);
            index = table.nextIndex - 1;
            continue;
          }

          const heading = line.match(/^(#{1,6})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = heading[1].length;
            const id = uniqueId(pendingAnchor || slugify(heading[2]));
            pendingAnchor = "";
            html.push(`<h${level} id="${escapeAttr(id)}">${renderInline(heading[2])}</h${level}>`);
            continue;
          }

          const blockquote = line.match(/^>\s?(.*)$/);
          if (blockquote) {
            closeParagraph();
            closeList();
            html.push(`<blockquote>${renderInline(blockquote[1])}</blockquote>`);
            continue;
          }

          const unordered = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            closeParagraph();
            const nextType = unordered ? "ul" : "ol";
            if (listType !== nextType) {
              closeList();
              html.push(`<${nextType}>`);
              listType = nextType;
            }
            html.push(`<li>${renderInline((unordered || ordered)[1])}</li>`);
            continue;
          }

          paragraph.push(line);
        }

        if (inCode) {
          html.push(`<pre><code class="language-${escapeAttr(codeLang || "text")}">${escapeHtml(codeLines.join("\n"))}</code></pre>`);
        }
        closeParagraph();
        closeList();
        return html.join("\n");
      }

      function renderNav() {
        nav.innerHTML = Object.entries(docs)
          .map(([file, doc]) => {
            const current = file === currentDoc ? ' aria-current="page"' : "";
            return `<a href="doc.html?doc=${encodeURIComponent(file)}"${current}>${escapeHtml(doc.title)}</a>`;
          })
          .join("");
      }

      function scrollToHash() {
        if (!window.location.hash) {
          return;
        }

        const id = decodeURIComponent(window.location.hash.slice(1));
        document.getElementById(id)?.scrollIntoView();
      }

      async function loadDoc() {
        renderNav();

        if (!Object.prototype.hasOwnProperty.call(docs, currentDoc)) {
          label.textContent = "unknown document";
          content.innerHTML = '<div class="error">Unknown document. Use the documentation navigation to open an available page.</div>';
          return;
        }

        const doc = docs[currentDoc];
        label.textContent = doc.title;
        document.documentElement.lang = doc.lang;
        document.title = `ovpn docs - ${doc.title}`;

        try {
          const response = await fetch(doc.source, { cache: "no-cache" });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const markdown = await response.text();
          content.innerHTML = renderMarkdown(markdown);
          scrollToHash();
        } catch (error) {
          content.innerHTML = `<div class="error">Failed to load ${escapeHtml(currentDoc)}: ${escapeHtml(error.message)}</div>`;
        }
      }

      loadDoc();
    </script>
  </body>
</html>
