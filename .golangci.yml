version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    gosec:
      severity: high
      confidence: high
  exclusions:
    # Match the standalone scanner scope: production packages, excluding tests.
    rules:
      - path: _test\.go
        linters:
          - gosec
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
