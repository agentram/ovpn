name: iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'mobile/androidbridge/**'
      - 'internal/clientcfg/**'
      - 'internal/xraycfg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'mobile/androidbridge/**'
      - 'internal/clientcfg/**'
      - 'internal/xraycfg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build O Tunnel and Packet Tunnel
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Install project generator
        run: brew install xcodegen
      - name: Identify the Xcode toolchain
        id: xcode
        run: echo "digest=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore the iOS core
        id: core-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/ios/Frameworks/MobileCore.xcframework
          key: ios-core-${{ runner.arch }}-${{ steps.xcode.outputs.digest }}-${{ hashFiles('apps/ios/build-core.sh', 'go.mod', 'go.sum', 'internal/**', 'mobile/**') }}
      - name: Build Xray for iOS and the simulator
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: apps/ios/build-core.sh
      - name: Cache the built iOS core
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/ios/Frameworks/MobileCore.xcframework
          key: ${{ steps.core-cache.outputs.cache-primary-key }}
      - name: Build the unsigned simulator app
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild -project O-Tunnel.xcodeproj -scheme O-Tunnel \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent \
            DerivedData/Build/Products/Debug-iphonesimulator/O-Tunnel.app O-Tunnel-simulator.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ovpn-tunnel-ios-simulator
          path: apps/ios/O-Tunnel-simulator.zip
          if-no-files-found: error
