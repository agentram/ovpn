name: End-to-end

on:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    name: Select E2E suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cli: ${{ steps.select.outputs.cli }}
      desktop: ${{ steps.select.outputs.desktop }}
      android: ${{ steps.select.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check and apply selection rules
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B tests/e2e/changes.py --test
          python3 -B tests/e2e/changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" --output "$GITHUB_OUTPUT"

  cli:
    name: CLI and pinned tools
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: make e2e-tools

  desktop:
    name: Desk operator journeys
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            apps/desktop/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: apps/desktop/frontend
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npx --no-install playwright install chromium
      - run: make e2e-desktop

  android:
    name: O Tunnel emulator journeys
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Install Android SDK and rootable system image
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" \
            "emulator" "system-images;android-36;default;x86_64"
      - name: Test on disposable emulator
        env:
          OVPN_E2E_ANDROID_SERIAL: emulator-5554
          ANDROID_AVD_HOME: ${{ runner.temp }}/ovpn-avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod a+rw /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n ovpn-e2e -k "system-images;android-36;default;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd ovpn-e2e -port 5554 \
            -no-window -no-audio -no-snapshot -gpu swiftshader -writable-system \
            > "$RUNNER_TEMP/ovpn-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          make e2e-android

  result:
    name: E2E result
    needs: [changes, cli, desktop, android]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SELECTION: ${{ needs.changes.result }}
      CLI: ${{ needs.cli.result }}
      DESKTOP: ${{ needs.desktop.result }}
      ANDROID: ${{ needs.android.result }}
      RUN_CLI: ${{ needs.changes.outputs.cli }}
      RUN_DESKTOP: ${{ needs.changes.outputs.desktop }}
      RUN_ANDROID: ${{ needs.changes.outputs.android }}
    steps:
      - name: Require every selected suite to pass
        run: |
          [[ "$SELECTION" == success ]]
          verify() {
            printf '%s: selected=%s result=%s\n' "$1" "$2" "$3" | tee -a "$GITHUB_STEP_SUMMARY"
            case "$2:$3" in
              true:success|false:skipped) ;;
              *) return 1 ;;
            esac
          }
          failed=0
          verify CLI "$RUN_CLI" "$CLI" || failed=1
          verify Desk "$RUN_DESKTOP" "$DESKTOP" || failed=1
          verify Android "$RUN_ANDROID" "$ANDROID" || failed=1
          exit "$failed"
