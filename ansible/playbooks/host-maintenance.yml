---
- name: Apply ovpn host maintenance without touching runtime scaffolding
  hosts: vpn_servers:proxy_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Apply swapfile baseline before package maintenance
      ansible.builtin.include_role:
        name: security
        tasks_from: swapfile

  roles:
    - role: common
    - role: docker
    - role: security
